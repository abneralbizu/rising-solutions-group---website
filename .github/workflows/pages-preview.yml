# Publishes the site folder to GitHub Pages as a review preview on every push to main.
# Turn it on once: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
# The preview is kept out of search engines (noindex + robots.txt).
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the preview copy
        run: |
          mkdir -p _preview
          cp -r site/. _preview/
          sed -i 's#<meta charset="utf-8">#<meta charset="utf-8">\n<meta name="robots" content="noindex, nofollow">#' _preview/index.html
          printf 'User-agent: *\nDisallow: /\n' > _preview/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _preview
      - id: deployment
        uses: actions/deploy-pages@v4
